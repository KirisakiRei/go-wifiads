<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Materi Iklan Wi-Fi">
  <!-- Solid crisp light canvas with neat border -->
  <rect width="640" height="280" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  
  <!-- Subtle header badge -->
  <rect x="24" y="24" width="130" height="26" rx="4" fill="#e2e8f0"/>
  <text x="89" y="41" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SPONSOR RESMI</text>
  
  <!-- Wi-Fi Icon clean solid blue -->
  <g transform="translate(320, 110)">
    <path d="M-40 -30 C-24 -46 24 -46 40 -30" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <path d="M-26 -14 C-16 -24 16 -24 26 -14" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <path d="M-12 2 C-7 -3 7 -3 12 2" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="4.5" fill="#2563eb"/>
  </g>
  
  <!-- Clean typography -->
  <text x="320" y="172" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">Layanan Wi-Fi Publik Berkecepatan Tinggi</text>
  <text x="320" y="200" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400">Disediakan gratis dengan dukungan periklanan digital resmi</text>
  
  <!-- Footer pill tag -->
  <rect x="220" y="226" width="200" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="244" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500">Ruang Iklan Sponsor (640 × 280)</text>
</svg>
