# /etc/nginx/sites-available/wifiads
# Reverse proxy for the Wi-Fi Ads stack. TLS is issued by certbot, which
# rewrites this file in place; only edit the upstream/location blocks.

upstream wifiads_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Rate/size limits matter here: nginx is the only thing exposed to the internet.
limit_req_zone $binary_remote_addr zone=wifiads_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wifiads.smartscales.web.id;

    # Keep the ACME challenge on plain HTTP so certbot can renew unattended.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wifiads.smartscales.web.id;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/wifiads.smartscales.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wifiads.smartscales.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;   # ad image/video uploads

    # Admin auth is the most brute-forceable endpoint; throttle it hard.
    location = /api/v1/admin/auth/login {
        limit_req zone=wifiads_login burst=5 nodelay;
        proxy_pass http://wifiads_api;
        include /etc/nginx/snippets/wifiads-proxy.conf;
    }

    location / {
        proxy_pass http://wifiads_api;
        include /etc/nginx/snippets/wifiads-proxy.conf;
    }
}
