<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ganti 192.168.88.254 dengan IP laptop server kamu -->
    <meta http-equiv="refresh" content="0; url=http://192.168.88.254:8080/portal?mac=$(mac)&ip=$(ip)&link-login-only=$(link-login-only-esc)&link-login=$(link-login-esc)&link-orig=$(link-orig-esc)&chap-id=$(chap-id)&chap-challenge=$(chap-challenge)">
    <title>Mengarahkan ke Portal Wi-Fi...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            max-width: 380px;
            width: 100%;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0066cc;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a { color: #0066cc; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h3>Mengarahkan ke Portal...</h3>
        <p style="font-size: 14px; color: #666; margin-bottom: 16px;">
            Jika tidak berpindah otomatis dalam beberapa detik, silakan klik tombol di bawah:
        </p>
        <a href="http://192.168.88.254:8080/portal?mac=$(mac)&ip=$(ip)&link-login-only=$(link-login-only-esc)&link-login=$(link-login-esc)&link-orig=$(link-orig-esc)&chap-id=$(chap-id)&chap-challenge=$(chap-challenge)" style="display: inline-block; background: #0066cc; color: white; padding: 10px 20px; border-radius: 6px;">
            Buka Halaman Login
        </a>
    </div>
</body>
</html>
